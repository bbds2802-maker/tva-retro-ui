<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-labelledby="title">
  <title id="title">Warm white touch UI: raised action, recessed selection and dusty rose progress</title>
  <defs>
    <filter id="lift" x="-35%" y="-35%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-4" dy="-4" stdDeviation="3.2" flood-color="#fff" flood-opacity=".82"/>
      <feDropShadow dx="4" dy="5" stdDeviation="3.6" flood-color="#a18e96" flood-opacity=".26"/>
    </filter>
    <linearGradient id="rim" x1="0" y1="0" x2=".4" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#c8babf"/>
      <stop offset=".22" stop-color="#e5dbde"/>
      <stop offset=".68" stop-color="#ede7e8"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".85"/>
    </linearGradient>
  </defs>
  <rect width="780" height="330" rx="25" fill="#f0ebeb" stroke="#e3dadc"/>
  <g font-family="system-ui, sans-serif" fill="#62595c">
    <text x="38" y="54" font-size="25" font-weight="400">暖白工作台</text>
    <text x="40" y="80" font-size="12" letter-spacing="2" fill="#75696d">WARM WHITE / TOUCH SURFACES</text>
    <path d="M40 103h700" stroke="#dfd6d9"/>
    <text x="42" y="133" font-size="13">01 · 微凸操作</text>
    <text x="288" y="133" font-size="13">02 · 浅凹选中</text>
    <text x="547" y="133" font-size="13">03 · 灰粉进度</text>
    <rect x="42" y="161" width="203" height="68" rx="15" fill="#f0ebeb" filter="url(#lift)"/>
    <text x="61" y="201" font-size="16">查看方案</text>
    <path d="M204 195h20m-8-8 8 8-8 8" stroke="#62595c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="288" y="161" width="214" height="68" rx="15" fill="url(#rim)"/>
    <rect x="291" y="165" width="208" height="61" rx="12" fill="#eee9e9"/>
    <text x="308" y="201" font-size="16" fill="#78515f">舒缓模式 · 已选</text>
    <path d="m467 196 5 5 9-10" stroke="#78515f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="634" cy="211" r="56" fill="#f0ebeb" filter="url(#lift)"/>
    <circle cx="634" cy="211" r="48" fill="none" stroke="#dfd6d9" stroke-width="3"/>
    <circle cx="634" cy="211" r="48" fill="none" stroke="#c3a1ab" stroke-width="4" pathLength="100" stroke-dasharray="72 28" transform="rotate(-90 634 211)" stroke-linecap="round"/>
    <text x="634" y="213" text-anchor="middle" font-size="24" font-weight="400">72%</text>
    <text x="634" y="233" text-anchor="middle" font-size="10" fill="#75696d">当前进度</text>
    <text x="42" y="271" font-size="12" fill="#75696d">同色顶面，左上亮边</text>
    <text x="288" y="271" font-size="12" fill="#75696d">轻微内凹，勾选辅助</text>
  </g>
</svg>
